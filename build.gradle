plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
    id 'com.xuncorp.spw.workshop' version '0.1.0-dev23'
}

repositories {
    google()
    mavenCentral()
    maven { url = uri('https://jitpack.io') }
}

dependencies {
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'
    compileOnly libs.spw.workshop.api
    testImplementation libs.spw.workshop.api
    testImplementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

kotlin {
    jvmToolchain(25)
}

// The host supplies Kotlin; do not package older transitive copies from OkHttp/coroutines.
configurations.runtimeClasspath {
    exclude group: 'org.jetbrains.kotlin'
}

spmod { config ->
    config.PluginClass = 'com.akikiri.MainPlugin'
    config.PluginId = 'akikiri_LastFm_scrobble'
    config.PluginVersion = '0.2.1'
    config.PluginProvider = 'akikiri'
    config.PluginName = 'Last.fm Scrobbler'
    config.PluginOpenSourceUrl = 'https://github.com/akikiri/LastFmForSaltPlayer'
    config.PluginDescription = 'Last.fm scrobbling using Salt Player metadata'
    config.PluginHasConfig = true
    config.PluginPermissions = [com.xuncorp.spw.workshop.gradle.PluginPermission.LIBRARY_READ]
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def lastFmApiKey = providers.gradleProperty("lastfm.api.key")
        .orElse(providers.environmentVariable("LASTFM_API_KEY"))
        .orElse(localProperties.getProperty("lastfm.api.key", ""))
def lastFmApiSecret = providers.gradleProperty("lastfm.api.secret")
        .orElse(providers.environmentVariable("LASTFM_API_SECRET"))
        .orElse(localProperties.getProperty("lastfm.api.secret", ""))

tasks.named("processResources") {
    inputs.property("lastFmApiKey", lastFmApiKey)
    inputs.property("lastFmApiSecret", lastFmApiSecret)
    filesMatching("lastfm.properties") {
        expand(
                lastfmApiKey: lastFmApiKey.get(),
                lastfmApiSecret: lastFmApiSecret.get()
        )
    }
}

test {
    useJUnitPlatform()
}
