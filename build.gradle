plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
}


repositories {
    google()
    mavenCentral()
    maven { url = uri('https://jitpack.io') }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.0'
    compileOnly libs.spw.workshop.api
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'net.jthink:jaudiotagger:3.0.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
def pluginClass = "com.akikiri.MainPlugin"
def pluginId = "akikiri_LastFm_scrobble"
def pluginVersion = "0.1.0"
def pluginProvider = "akikiri"
def PluginOpenSourceUrl="https://github.com/akikiri/LastFmForSaltPlayer"
def PluginDescription="LastFmForSaltPlayer"

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def lastFmApiKey = providers.gradleProperty("lastfm.api.key")
        .orElse(providers.environmentVariable("LASTFM_API_KEY"))
        .orElse(localProperties.getProperty("lastfm.api.key", ""))
def lastFmApiSecret = providers.gradleProperty("lastfm.api.secret")
        .orElse(providers.environmentVariable("LASTFM_API_SECRET"))
        .orElse(localProperties.getProperty("lastfm.api.secret", ""))

tasks.named("processResources") {
    inputs.property("lastFmApiKey", lastFmApiKey)
    inputs.property("lastFmApiSecret", lastFmApiSecret)
    filesMatching("lastfm.properties") {
        expand(
                lastfmApiKey: lastFmApiKey.get(),
                lastfmApiSecret: lastFmApiSecret.get()
        )
    }
}

tasks.named("jar") {
    manifest {
        attributes["Plugin-Class"] = pluginClass
        attributes["Plugin-Id"] = pluginId
        attributes["Plugin-Version"] = pluginVersion
        attributes["Plugin-Provider"] = pluginProvider
        attributes["Plugin-Open-Source-Url"] = PluginOpenSourceUrl
        attributes["Plugin-Description"] = PluginDescription
    }
}

tasks.register("plugin", Jar) {
    archiveBaseName.set("plugin-" + pluginId + "-" + pluginVersion)

    into("classes") {
        with(tasks.named("jar").get())
    }
    dependsOn(configurations.runtimeClasspath)
    into("lib") {
        from({
            configurations.runtimeClasspath
                    .filter { it.name.endsWith("jar") }
        })
    }
    archiveExtension = 'zip'
}

test {
    useJUnitPlatform()
}
